<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Escapes - Contact & Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Navigation bar-->
<nav class="navbar">
    <div class="navbarContainer">
        <a class="logo" href="index.html"><span>☘&#xFE0F;</span><span>Emerald Escapes</span></a>
        <ul class="pageLinks">
            <li><a  href="index.html">Home</a></li>
            <li><a href="experiences.html">Experiences</a></li>
            <li><a class="active" href="contact.html">Contact & Booking</a></li>
        </ul>
    </div>
</nav>
<header class="container text-center my-5">
    <h1 class="fw-bold" style="color: #1b4d3e;">Contact Us</h1>
    <p>Complete the form below. All fields are Required.</p>
</header>

<main class ="container my-5" style="max-width: 600px;">


    <form id="contactForm" novalidate>
        <div class="mb-3">
            <label for="fullName" class="form-label" >Full Name</label>
            <input type= "text" class="form-control" id="fullName" autocomplete="name" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label" >Email</label>
            <input type="email" class="form-control" id="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" autocomplete="tel" required>
        </div>
        <div class="mb-3">
        <label for="enquiry" class="form-label" >Enquiry type</label>
            <select id="enquiry" class="form-select" name="enquiry" required>
                <option value=""> Please choose </option>
                <option value="booking"> Booking </option>
                <option value="general"> General Information </option>
                <option value="payment"> Payment </option>
                <option value="other"> Other </option>
            </select>
        </div>
        <div class="mb-3">
        <label for="message" class="form-label" >Message</label>
        <textarea id="message" class="form-control" name="message" rows="5" required></textarea>
        </div>

        <div class="mb-3">
        <button type="submit" class="btn btn-success fw-bold w-100">Send message</button>
        </div>

    </form>
    <p id="result"></p>
</main>




<footer class="footer">
    <p>2026 Emerald Escapes. All rights reserved</p>
</footer>

</body>
</html>
